[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-checkers-game"
version = "0.1.6"
description = "Networked terminal Chinese Checkers built with Textual"
readme = "README.md"
requires-python = ">=3.13"

license = {file = "LICENSE"}

dependencies = [
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "textual",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
chinese-checkers = "chinese_checkers.client.main:main"
chinese-checkers-server = "chinese_checkers.server.main:main"

[project.urls]
Homepage = "https://github.com/carsonthorne"
Repository = "https://github.com/carsonthorne/text-jam-2026"
Issues = "https://github.com/carsonthorne/text-jam-2026/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chinese_checkers = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["chinese_checkers"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python-version = "3.13"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
    "ty>=0.0.51",
]
